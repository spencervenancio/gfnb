[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "demo"
version = "0.0.1"
description = "This is a demo of the CCDS Project Structure for the Graduating from Notebooks workshop."
authors = [
  { name = "Spencer Venancio, Undergraduate Statistics Club" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = ">=3.10"


[tool.ruff]
line-length = 99
src = ["demo"]
include = ["pyproject.toml", "demo/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["demo"]
force-sort-within-sections = true

